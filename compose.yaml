name: ios-history-app
services:
  app:
    image: ios-history-app:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      DATA_DIR: /data
      TRUST_PROXY: "1"
      MIN_FREE_GB: ${MIN_FREE_GB:-8}
    volumes:
      - app_data:/data
      - device_data:/app/.runtime/device
      - sap_cache:/app/.runtime/sap-cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    networks: [app_net]
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    init: true
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      REAL_IP_TRUSTED_CIDR: ${REAL_IP_TRUSTED_CIDR:-127.0.0.1/32}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    networks: [app_net]
volumes:
  app_data:
  device_data:
  sap_cache:
networks:
  app_net: {driver: bridge}
